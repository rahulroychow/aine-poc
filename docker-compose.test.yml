version: '3.9'

# ===== Test Configuration =====
# Use with: docker-compose -f docker-compose.yml -f docker-compose.test.yml up

services:
  app:
    environment:
      NODE_ENV: test
      REACT_APP_API_URL: http://server:5000
    # Don't expose ports in test
    ports: []

  server:
    environment:
      NODE_ENV: test
      LOG_LEVEL: info
    ports: []
    # In test, disable restarts to fail fast
    restart: "no"
