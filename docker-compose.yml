version: '3.9'

services:
  # ===== Frontend Service =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aine-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - aine-network
    profiles:
      - app
      - full
    restart: unless-stopped
    labels:
      - "com.aine.service=app"
      - "com.aine.description=Frontend React application"

  # ===== Backend Service =====
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: aine-server
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
    networks:
      - aine-network
    profiles:
      - server
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - "com.aine.service=server"
      - "com.aine.description=Node.js backend API server"
    # Optional: Uncomment for production logging
    # logging:
    #   driver: json-file
    #   options:
    #     max-size: "10m"
    #     max-file: "3"

# ===== Networks =====
networks:
  aine-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

